<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airtext Display - Developer Dashboard & Playground</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              400: '#38bdf8',
              500: '#0284c7',
              600: '#0369a1',
              accent: '#38bdf8',
            },
            jcd: {
              red: '#e30613',
              dark: '#0f172a',
              card: '#1e293b',
              border: '#334155',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }


    /* Device frame responsiveness */
    .viewport-container {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center center;
    }
  </style>
</head>

<body class="bg-mist-50 text-slate-100 font-sans h-full flex flex-col antialiased selection:bg-brand-500 selection:text-white">
{% include boardheader.html %}
  <!-- Top Navigation Header -->
  

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 overflow-y-auto bg-mist-50 p-4 sm:p-6 lg:p-8">
    <div class="max-w-7xl mx-auto">

        
        <!-- Controls Toolbar Card -->
        <div class="bg-sky-800 border border-slate-800 rounded-xl p-4 sm:p-5 shadow-lg space-y-4">
          <!-- Grid of Controls -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            
            <!-- 1. Preset Aspect Ratios -->
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1.5">
                <i class="fa-solid fa-expand text-slate-400 mr-1"></i> Screen Spec / Aspect Ratio
              </label>
              <select id="aspect-preset-select" onchange="applyAspectPreset(this.value)" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                <option value="9:16" selected>9:16 Portrait (1080x1920)</option>
                <option value="2:3">2:3 Portrait (576x864)</option>
                <option value="2:1">2:1 Landscape (1440x720)</option>
				<option value="1:1">1:1 Square (800x800)</option>
                <option value="custom">Custom Dimensions...</option>
              </select>
            </div>

            <!-- 2. Zone Selection -->
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1.5">
                <i class="fa-solid fa-location-dot text-slate-400 mr-1"></i> Zone
              </label>
              <select id="zone-select" onchange="updateIframeUrl()" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                <optgroup label="--- Most Popular ---">
        			<option value="Southwark">Southwark</option>
                	<option value="Lambeth">Lambeth</option>
    			</optgroup>
				<optgroup label="--- London boroughs ---">
        			<option value="Barnet">Barnet</option>
                	<option value="Bexley">Bexley</option>
    			</optgroup>
				<optgroup label="--- Essex regions ---">
					<option value="Chelmsford">Chelmsford</option>
        			<option value="Colchester">Colchester</option>
                	<option value="Maldon">Maldon</option>
    			</optgroup>
			    <optgroup label="--- Surrey regions ---">
        			<option value="Elmbridge">Elmbridge</option>
                	<option value="Runnymede">Runnymede</option>
    			</optgroup>
				 
              </select>
            </div>

            <!-- 3. Dynamic Variant Trigger -->
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1.5">
                <i class="fa-solid fa-cloud-sun text-slate-400 mr-1"></i> Pollution level
              </label>
              <select id="variant-select" onchange="updateIframeUrl()" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                <option value="" selected>Current</option>
                <option value="moderatePollutionToday">Moderate today</option>
                <option value="highPollutionToday">High today</option>
				<option value="veryHighPollutionToday">Very high today</option>
				<option value="moderatePollutionTomorrow">Moderate tomorrow</option>
                <option value="highPollutionTomorrow">High tomorrow</option>
				<option value="normal">Info</option>
              </select>
            </div>


          </div>

          <!-- Custom Dimensions Bar (Hidden by Default) -->
          <div id="custom-dim-panel" class="hidden pt-3 border-t border-slate-800/80 flex items-center gap-4 text-xs">
            <span class="text-slate-400 font-medium">Custom Screen Size:</span>
            <div class="flex items-center gap-2">
              <input type="number" id="custom-w" value="1080" class="w-20 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-slate-200 text-center font-mono">
              <span class="text-slate-500">×</span>
              <input type="number" id="custom-h" value="1920" class="w-20 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-slate-200 text-center font-mono">
              <span class="text-slate-500">px</span>
              <button onclick="applyCustomDimensions()" class="bg-brand-500 hover:bg-brand-600 text-white px-3 py-1 rounded text-xs transition-colors">Apply</button>
            </div>
          </div>
        </div>

        <!-- Interactive Preview Stage Container -->
        <div class="bg-mist-800/60 border border-slate-800 rounded-xl p-4 sm:p-6 min-h-[650px] flex flex-col items-center justify-center relative overflow-hidden">
          
          <!-- Screen Toolbar Header -->
          <div class="w-full flex items-center justify-between mb-4 px-2 text-xs text-slate-400">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-yellow-500"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
              <span class="ml-2 font-mono text-slate-300" id="screen-info-badge">9:16 Portrait (1080 × 1920)</span>
            </div>

          </div>

          <!-- CANVAS / IFRAME WRAPPER -->
          <div id="viewport-stage" class="viewport-container relative bg-black shadow-2xl rounded-lg border-2 border-slate-700 overflow-hidden" 
               style="width: 640px; height: 360px;">
            

            <!-- Embedded Live Display Frame -->
            <iframe id="display-iframe" 
                    src="https://airtext-jcd-display.onrender.com/?zone=Southwark&orientation=portrait" 
                    class="w-full h-full border-0 bg-slate-900" 
                    title="JCDecaux Live Screen Preview"
                    allowfullscreen>
            </iframe>
          </div>


        </div>

      



    </div>
  </main>

  <!-- JavaScript Controller -->
  <script>
    // State management
    let isZoomedFit = false;

    

    // Apply Aspect Ratio Presets
    function applyAspectPreset(preset) {
      const stage = document.getElementById('viewport-stage');
      const customPanel = document.getElementById('custom-dim-panel');
      const infoBadge = document.getElementById('screen-info-badge');

      if (preset === 'custom') {
        customPanel.classList.remove('hidden');
        return;
      } else {
        customPanel.classList.add('hidden');
      }

      let w = 360;
      let h = 640;
      let label = '';

      switch(preset) {
        case '9:16':
          w = 640;
          h = 360;
          label = '9:16 Portrait (1080 x 1920)';
          break;
        case '2:3':
          w = 540;
          h = 360;
          label = '2:3 Portrait (576 x 864)';
          break;
        case '2:1':
          w = 720;
          h = 360;
          label = '2:1 Landscape (1440 x 720)';
          break;
		case '1:1':
          w = 360;
          h = 360;
          label = '1:1 Square (800 x 800)';
          break;
      }

      stage.style.width = `${w}px`;
      stage.style.height = `${h}px`;
      infoBadge.textContent = label;
updateIframeUrl();
    }

    // Apply Custom Dimensions
    function applyCustomDimensions() {
      const wVal = document.getElementById('custom-w').value;
      const hVal = document.getElementById('custom-h').value;
      const stage = document.getElementById('viewport-stage');
      const infoBadge = document.getElementById('screen-info-badge');

      if (wVal && hVal) {
        // Scaled preview container size capped for screen visibility
        const scaleFactor = Math.min(600 / wVal, 600 / hVal, 1);
        const displayW = Math.round(wVal * scaleFactor);
        const displayH = Math.round(hVal * scaleFactor);

        stage.style.width = `${displayW}px`;
        stage.style.height = `${displayH}px`;
        infoBadge.textContent = `Custom (${wVal} × ${hVal})`;
      }
	  updateIframeUrl();
    }

    // Update Live Iframe URL based on selections
    function updateIframeUrl() {
      const zone = document.getElementById('zone-select').value;
      const variant = document.getElementById('variant-select').value;
      const iframe = document.getElementById('display-iframe');
      const urlDisplay = document.getElementById('current-url-display');
      var targetUrl="";
const aspec = document.getElementById('aspect-preset-select').value;
let w = "portrait";


      switch(aspec) {
        case '2:1':
          w = "landscape";
          break;
		case '1:1':
          w = "landscape";
          break;
	case 'custom':
const wVal = document.getElementById('custom-w').value;
      const hVal = document.getElementById('custom-h').value;
	  if (wVal > hVal) {
	    w = "landscape";
	  }
      }

      const baseUrl = 'https://airtext-jcd-display.onrender.com/';
      if (variant) {
		  if (variant == "normal") {
			  const items = ["educational", "subscription-reflexive", "subscription-actionable"];
			  const randomItem = items[Math.floor(Math.random() * items.length)];
			  targetUrl = `${baseUrl}?zone=${encodeURIComponent(zone)}&orientation=${encodeURIComponent(w)}&dummy=normal&info=${randomItem}`;
		  } else {
			targetUrl = `${baseUrl}?zone=${encodeURIComponent(zone)}&orientation=${encodeURIComponent(w)}&dummy=${encodeURIComponent(variant)}`;
		  }
      } else {
	targetUrl = `${baseUrl}?zone=${encodeURIComponent(zone)}&orientation=${encodeURIComponent(w)}`;
    
		  
		  
      }


      iframe.src = targetUrl;
      urlDisplay.textContent = targetUrl;
    }

    // Toggle Safe Zone Visual Overlay
    function toggleSafeZone(show) {
      const overlay = document.getElementById('overlay-layer');
      if (show) {
        overlay.style.display = 'block';
      } else {
        overlay.style.display = 'none';
      }
    }

    // Reload Canvas Frame
    function reloadIframe() {
      const iframe = document.getElementById('display-iframe');
      iframe.src = iframe.src;
    }

    // Quick Trigger Variant State from API Tab
    function triggerVariantState(variant) {
      document.getElementById('variant-select').value = variant;
      switchTab('playground');
      updateIframeUrl();
    }

    // Copy to Clipboard Utility
    function copyToClipboard(text) {
      const tempInput = document.createElement('textarea');
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      
      // Visual feedback
      alert('Copied URL to clipboard!');
    }

    function copyCode(btn) {
      const pre = btn.previousElementSibling;
      if (pre) {
        const text = pre.innerText;
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);

        const origText = btn.innerText;
        btn.innerText = 'Copied!';
        setTimeout(() => { btn.innerText = origText; }, 2000);
      }
    }
  </script>
</body>
</html>
