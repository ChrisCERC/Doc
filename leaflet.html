<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>airTEXT WMS Time Demonstration</title>

  <!-- Leaflet CSS & JS via CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // 1. Initialize Map
    const map = L.map('map').setView([51.505, -0.09], 10);

    // 2. Base Tile Layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 3. Initial WMS Layer with TIME parameter
    let currentTime = '2026-10-07T00:00:00Z';

    const airtextWMS = L.tileLayer.wms('https://api.airtext.info/geoserver/london/wms', {
      layers: 'NO2',
      format: 'image/png',
      transparent: true,
      version: '1.3.0',
      opacity: 0.75,
      time: currentTime, // WMS TIME parameter
      attribution: '&copy; airTEXT'
    }).addTo(map);

    
  </script>

</body>
</html>
