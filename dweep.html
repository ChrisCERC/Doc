<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>London Air Quality Data API</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#f6f7f9;--card:#fff;--text:#1d2530;--muted:#5d6877;--line:#dde2e8;--code:#14202e;--codetext:#e6edf5;
 --get:#2563eb;--accent:#0f766e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#18202a;--text:#e6edf5;--muted:#93a1b3;--line:#2a3542;--code:#0b1118;--codetext:#e6edf5;--get:#60a5fa;--accent:#2dd4bf}}
:root[data-theme="dark"]{--bg:#10151b;--card:#18202a;--text:#e6edf5;--muted:#93a1b3;--line:#2a3542;--code:#0b1118;--codetext:#e6edf5;--get:#60a5fa;--accent:#2dd4bf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 4px;font-size:26px} h2{margin:32px 0 10px;font-size:18px;border-bottom:2px solid var(--accent);padding-bottom:4px}
p{margin:6px 0;color:var(--muted)} code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.base{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:14px}
.base code{color:var(--accent);word-break:break-all}
details{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--get);border-radius:8px;margin:10px 0}
summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{background:var(--get);color:#fff;font-weight:700;font-size:12px;padding:3px 10px;border-radius:4px}
.path{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600} .desc{color:var(--muted);font-size:14px}
.body{padding:0 14px 14px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.req{color:#dc2626;font-size:11px;font-weight:700} .opt{color:var(--muted);font-size:11px}
.pre{position:relative;background:var(--code);color:var(--codetext);border-radius:6px;padding:12px 14px;overflow-x:auto}
.pre pre{margin:0;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.copy{position:absolute;top:6px;right:6px;border:1px solid #3b4a5c;background:#223042;color:#e6edf5;border-radius:4px;font-size:12px;padding:3px 9px;cursor:pointer}
.note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>WCS</h1>
  <p>Open, read-only access to gridded air quality data using standard OGC services. Every operation is an HTTP <code>GET</code>, so you can call it from curl, Python, R, QGIS or any GIS tool.</p>
  <div class="base"><strong>Base URL</strong><br><code>https://api.airtext.info/geoserver/london</code></div>
  <div id="ops"></div>
</main>
<script>
const B = 'https://api.airtext.info/geoserver/london';
const T = '2026-10-09T00:00:00.000Z';
const P = (name, req, type, desc, ex) => ({name, req, type, desc, ex});

const WCS_COMMON = [
  P('service', 1, 'string', 'Must be WCS.', 'WCS'),
  P('version', 1, 'string', 'WCS version.', '2.0.0'),
];
const curl = (url, params, out) => 'curl -G "' + url + '" \\\n' +
  params.map(p => "  --data-urlencode '" + p + "'").join(' \\\n') + (out ? ' \\\n  -o ' + out : '');

const ops = 
 {group:'WCS: raw data', items:[
  {path:'/wcs', title:'GetCoverage', desc:'Downloads the raw grid values for an area and time as a GeoTIFF.',
   params:[...WCS_COMMON,
    P('request',1,'string','Must be GetCoverage.','GetCoverage'),
    P('coverageId',1,'string','Pollutant to download. One of: NO2, PM10, PM25, O3, Total.','NO2'),
    P('format',1,'string','Output format. GeoTIFF is image/tiff.','image/tiff'),
    P('subset',1,'string','Output geographical area (longitude)','Long(-0.12,-0.11)'),
    P('subset',1,'string','Output geographical area (latitude)','Lat(51.51,51.52)'),
    P('subset',1,'string','Date','time("2026-10-09T00:00:00.000Z")')],
   curl:curl(B+'/wcs',['service=WCS','version=2.0.0','request=GetCoverage','coverageId=NO2','format=image/tiff','subset=Long(-0.12,-0.11)','subset=Lat(51.51,51.52)','subset=time("'+T+'")'],'no2.tif'),
   resp:'200: image/tiff (GeoTIFF; open in QGIS, GDAL, rasterio). 400: invalid subset or time not available.<img src="./assets/img/WCS.png" alt="Example WCS GeoTIFF output" width="250px" />'}]}
];

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const root = document.getElementById('ops');
ops.forEach(g => {
  root.insertAdjacentHTML('beforeend', '<h2>' + g.group + '</h2>');
  g.items.forEach(o => {
    const rows = o.params.map(p => '<tr><td><code>' + p.name + '</code><br>' +
      (p.req ? '<span class="req">REQUIRED</span>' : '<span class="opt">optional</span>') +
      '</td><td>query<br><span class="opt">' + p.type + '</span></td><td>' + esc(p.desc) +
      '</td><td><code>' + esc(p.ex || '(blank)') + '</code></td></tr>').join('');
    root.insertAdjacentHTML('beforeend',
      '<details><summary><span class="badge">GET</span><span class="path">' + o.path +
      '</span><b>' + o.title + '</b><span class="desc">' + o.desc + '</span></summary><div class="body">' +
      '<h3>Parameters</h3><div class="scroll"><table><tr><th>Name</th><th>In / type</th><th>Description</th><th>Example</th></tr>' + rows + '</table></div>' +
      '<h3>Example request (curl)</h3><div class="pre"><button class="copy">Copy</button><pre>' + esc(o.curl) + '</pre></div>' +
      '<h3>Responses</h3><p>' + esc(o.resp) + '</p></div></details>');
  });
});
root.querySelector('details').open = true;
root.addEventListener('click', e => {
  if (!e.target.classList.contains('copy')) return;
  const text = e.target.nextElementSibling.textContent, b = e.target;
  const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500); };
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch (x) {} t.remove(); };
  (navigator.clipboard ? navigator.clipboard.writeText(text).then(done, fallback) : fallback());
});
</script>
</body>
</html>
